<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie Recommender Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { padding-top: 50px; }
      #chatBox { max-height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 5px; }
      .user-msg { text-align: right; }
      .agent-msg { text-align: left; }
      .msg-bubble { display: inline-block; padding: 8px 12px; border-radius: 15px; margin: 5px 0; max-width: 70%; }
      .user-bubble { background-color: #0d6efd; color: white; }
      .agent-bubble { background-color: #f1f1f1; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center mb-4">Movie Chatbot</h1>
      <div id="chatBox"></div>
      <div class="input-group mt-3">
        <input type="text" id="chatInput" class="form-control" placeholder="Type a message..." autocomplete="off">
        <button class="btn btn-primary" id="sendBtn">Send</button>
      </div>
    </div>

    <script>
      const chatBox = document.getElementById('chatBox');
      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');

      function appendMessage(text, isUser) {
        const wrapper = document.createElement('div');
        wrapper.className = isUser ? 'user-msg' : 'agent-msg';
        const bubble = document.createElement('span');
        bubble.className = 'msg-bubble ' + (isUser ? 'user-bubble' : 'agent-bubble');
        bubble.textContent = text;
        wrapper.appendChild(bubble);
        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function sendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;
        appendMessage(message, true);
        chatInput.value = '';
        fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        })
        .then(resp => resp.json())
        .then(data => {
          appendMessage(data.reply, false);
        })
        .catch(err => {
          appendMessage('Sorry, something went wrong.', false);
          console.error(err);
        });
      }

      sendBtn.addEventListener('click', sendMessage);
      chatInput.addEventListener('keyup', function(e) {
        if (e.key === 'Enter') {
          sendMessage();
        }
      });
    </script>
  </body>
</html>
