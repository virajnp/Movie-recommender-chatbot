<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie Recommender</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { padding-top: 50px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center mb-4">Movie Recommender</h1>
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="card-body">
              <form id="recommendForm">
                <div class="mb-3">
                  <label for="movieInput" class="form-label">Enter a movie title</label>
                  <input type="text" class="form-control" id="movieInput" placeholder="e.g., Toy Story (1995)" required>
                </div>
                <button type="submit" class="btn btn-primary">Get Recommendations</button>
              </form>
            </div>
          </div>
          <div id="resultArea" class="mt-4" style="display: none;">
            <div class="card">
              <div class="card-body">
                <h4 id="resultTitle"></h4>
                <ul id="resultList" class="list-group list-group-flush"></ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS (optional) and custom script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('recommendForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const movie = document.getElementById('movieInput').value;
        fetch('/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ movie: movie })
        })
        .then(response => response.json())
        .then(data => {
          const resultArea = document.getElementById('resultArea');
          const resultTitle = document.getElementById('resultTitle');
          const resultList = document.getElementById('resultList');
          resultList.innerHTML = '';
          if (data.error) {
            resultTitle.textContent = data.error;
          } else {
            resultTitle.textContent = `Recommendations for "${movie}":`;
            data.recommendations.forEach(rec => {
              const li = document.createElement('li');
              li.className = 'list-group-item';
              li.textContent = rec;
              resultList.appendChild(li);
            });
          }
          resultArea.style.display = 'block';
        })
        .catch(err => console.error(err));
      });
    </script>
  </body>
</html>
